# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Cycle"
  short_description: "Run one feature through the engineering workflow"
  default_prompt: "Run the dev-cycle skill: read its SKILL.md, resume this feature from durable repo state, and coordinate the installed engineering skills through fresh subagents across the effective workflow tier unless I steer otherwise. Verify each stage from durable evidence before advancing. Astra is forbidden for this run and every descendant agent; keep the current Codex model, or use gpt-6-luna when explicit model selection is required."
